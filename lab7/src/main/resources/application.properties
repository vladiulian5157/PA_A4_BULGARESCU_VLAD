# Setari server web
server.port=8081

# Conexiunea la baza de date (Modifica cu datele tale)
spring.datasource.url=jdbc:postgresql://localhost:2026/postgres
spring.datasource.username=postgres
spring.datasource.password=STUDENT

# Setari JPA / Hibernate
# "update" creaza tabelele automat daca nu exista
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect